name: Go

on:
  push:
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: staticcheck
      uses: reviewdog/action-staticcheck@v1
      with:
        reporter: github-check

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
